services:
  db:
    container_name: donoplatform_postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: donoplatform_db
      POSTGRES_USER: donoplatform_user
      POSTGRES_PASSWORD: dono2025
      PGDATA: /data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge
