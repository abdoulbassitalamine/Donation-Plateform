<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)"
      xmlns:layout="[http://www.ultraq.net.nz/thymeleaf/layout](http://www.ultraq.net.nz/thymeleaf/layout)"
      layout:decorate="~{layout}">
<head>
    <title>Mes lots - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content">
    <!-- En-tête -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-4xl font-bold text-gray-900">📦 Mes lots</h1>
            <p class="text-gray-600 mt-2">Regroupez vos annonces en lots pour faciliter les dons groupés</p>
            <p class="text-sm text-gray-500 mt-1">
                <span th:text="${batches.size()}">0</span> lot(s) créé(s)
            </p>
        </div>

        <button onclick="showCreateModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition">
            ➕ Créer un lot
        </button>
    </div>

    <!-- Liste des batches (inchangée) -->
    <div th:if="${!batches.isEmpty()}" class="space-y-6">
        <div th:each="batch : ${batches}" class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
            <!-- Contenu du batch... -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-2">Lot #<span th:text="${batch.id}">1</span></h3>
                        <p class="text-blue-100 text-sm mb-3">
                            Créé le <span th:text="${#temporals.format(batch.createdAt, 'dd MMMM yyyy à HH:mm')}">date</span>
                        </p>
                    </div>
                    <div class="flex space-x-2">
                        <a th:href="@{/batches/{id}(id=${batch.id})}" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg font-semibold transition">👁️ Voir</a>
                        <form th:action="@{/batches/{id}/delete(id=${batch.id})}" method="POST" onsubmit="return confirm('Supprimer ce lot ?');">
                            <button type="submit" class="bg-red-500/80 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold transition">🗑️</button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Grille des annonces... -->
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div th:each="announcement : ${batch.announcements}"
                         class="border border-gray-200 rounded-lg p-4 hover:border-blue-500 transition cursor-pointer"
                         th:onclick="|window.location.href='/announcements/${announcement.id}'|">
                        <span th:text="${announcement.title}">Titre</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message si vide -->
    <div th:if="${batches.isEmpty()}" class="bg-white rounded-lg shadow-md p-16 text-center">
        <div class="text-8xl mb-6">📦</div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4">Aucun lot créé</h2>
        <button onclick="showCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-lg font-semibold transition text-lg">➕ Créer mon premier lot</button>
    </div>

    <!-- Modal de création de lot -->
    <div id="createBatchModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="bg-blue-600 text-white p-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold">➕ Créer un nouveau lot</h2>
                    <button onclick="closeCreateModal()" class="text-white hover:text-gray-200 text-3xl">&times;</button>
                </div>
            </div>

            <form th:action="@{/batches}" method="POST">
                <div class="p-6 overflow-y-auto max-h-[calc(90vh-200px)]">
                    <div class="mb-4 bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <p class="text-blue-800 font-semibold">
                            <span id="selectedCount">0</span> annonce(s) sélectionnée(s)
                        </p>
                    </div>

                    <div id="announcementsList" class="space-y-3">
                        <div th:each="announcement : ${userAnnouncements}"
                             class="border border-gray-200 rounded-lg p-4 hover:border-blue-500 transition cursor-pointer"
                             onclick="toggleCheckbox(this)">
                            <div class="flex items-center space-x-4">
                                <input type="checkbox" name="announcementIds" th:value="${announcement.id}"
                                       class="w-5 h-5 text-blue-600 rounded"
                                       onchange="updateSelectedCount()" onclick="event.stopPropagation()">
                                <div class="flex-1">
                                    <h4 class="font-semibold" th:text="${announcement.title}">Titre</h4>
                                    <p class="text-sm text-gray-500" th:text="${announcement.status.label}">Statut</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-200 p-6 bg-gray-50 flex justify-between items-center">
                    <button type="button" onclick="closeCreateModal()" class="px-6 py-3 border rounded-lg hover:bg-gray-100 font-semibold">Annuler</button>
                    <!-- Bouton avec ID et état désactivé par défaut -->
                    <button type="submit" id="submitBatchBtn" disabled
                            class="disabled:opacity-50 disabled:cursor-not-allowed bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-semibold transition">
                        ✅ Créer le lot
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Fragment Scripts séparé et bien placé -->
<th:block layout:fragment="scripts">
    <script>
        function showCreateModal() {
            const modal = document.getElementById('createBatchModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            updateSelectedCount(); // Initialise l'état du bouton
        }

        function closeCreateModal() {
            const modal = document.getElementById('createBatchModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateSelectedCount();
        }

        function toggleCheckbox(element) {
            const checkbox = element.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checkboxes = document.querySelectorAll('input[name="announcementIds"]:checked');
            const count = checkboxes.length;
            const submitBtn = document.getElementById('submitBatchBtn');
            const countDisplay = document.getElementById('selectedCount');

            // Mise à jour de l'affichage
            countDisplay.textContent = count;

            // Validation : Activer le bouton seulement si count > 0
            if (count > 0) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</th:block>

</body>
</html>
