<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Publier une annonce - DonoPlatform</title>
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="create-announcement-container">
        <div class="form-card">
            <h1 class="form-title">Publier une annonce</h1>

            <!-- Messages d'erreur -->
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>

            <!-- Formulaire -->
            <form th:action="@{/announcements}"
                  th:object="${announcement}"
                  method="POST"
                  enctype="multipart/form-data"
                  class="form-groups">

                <!-- Titre -->
                <div class="form-field">
                    <label for="title">Titre de l'annonce *</label>
                    <input type="text" id="title" th:field="*{title}" required maxlength="100"
                           placeholder="Ex: Canapé 3 places en bon état">
                </div>

                <!-- Description -->
                <div class="form-field">
                    <label for="description">Description *</label>
                    <textarea id="description" th:field="*{description}" required maxlength="1000" rows="5"
                              placeholder="Décrivez votre objet..."></textarea>
                </div>

                <!-- Section Images -->
                <div class="image-upload-section">
                    <label class="image-upload-label">📷 Photos de l'objet</label>

                    <div class="image-upload-button-wrapper">
                        <label class="image-upload-button">
                            <span>Choisir des fichiers</span>
                            <input type="file" name="images" id="imagesInput" multiple accept="image/*" onchange="previewImages()">
                        </label>
                        <p class="image-upload-help">Vous pouvez sélectionner plusieurs images (JPG, PNG)</p>
                    </div>

                    <!-- Grille de prévisualisation -->
                    <div id="imagePreview" class="image-preview-grid">
                        <!-- Les miniatures apparaîtront ici via JS -->
                    </div>
                </div>

                <!-- État et Zone -->
                <div class="form-row form-row-2">
                    <div class="form-field">
                        <label for="itemCondition">État de l'objet *</label>
                        <select id="itemCondition" th:field="*{itemCondition}" required>
                            <option value="">Sélectionnez un état</option>
                            <option th:each="condition : ${itemConditions}" th:value="${condition.name()}" th:text="${condition.label}"></option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="geographicArea">Zone géographique *</label>
                        <input type="text" id="geographicArea" th:field="*{geographicArea}" required
                               placeholder="Ex: Paris, Lyon 3e">
                    </div>
                </div>

                <!-- Options -->
                <div class="checkbox-group">
                    <label>Options de remise *</label>
                    <div style="display: flex; gap: 1.5rem;">
                        <label class="checkbox-item">
                            <input type="checkbox" th:field="*{handDelivery}">
                            <span>Main propre</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" th:field="*{canShip}">
                            <span>Envoi possible</span>
                        </label>
                    </div>
                </div>

                <!-- Mots-clés -->
                <div class="form-field">
                    <label for="keywords">Mots-clés (séparés par des virgules)</label>
                    <input type="text" id="keywords" name="keywords"
                           placeholder="meuble, salon, bois...">
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        📢 Publier l'annonce
                    </button>
                    <a th:href="@{/announcements}" class="btn-cancel">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de prévisualisation -->
    <script>
        function previewImages() {
            const preview = document.getElementById('imagePreview');
            const files = document.getElementById('imagesInput').files;
            preview.innerHTML = '';

            if (files) {
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'image-preview-item';
                        div.innerHTML = `<img src="${e.target.result}">`;
                        preview.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }
    </script>
</div>
</body>
</html>
