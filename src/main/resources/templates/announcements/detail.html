<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title th:text="${announcement.title} + ' - DonoPlatform'">Annonce - DonoPlatform</title>
    <link rel="stylesheet" th:href="@{/css/announcements.css}">
</head>
<body>
<div layout:fragment="content">
    <!-- Breadcrumb -->
    <nav class="breadcrumb">
        <ol>
            <li><a th:href="@{/}">Accueil</a></li>
            <li>›</li>
            <li><a th:href="@{/announcements}">Annonces</a></li>
            <li>›</li>
            <li class="active" th:text="${announcement.title}">Titre</li>
        </ol>
    </nav>

    <div class="detail-layout">
        <!-- Colonne principale -->
        <div class="detail-main">
            <!-- Images -->
            <div class="detail-images">
                <div th:if="${!announcement.images.isEmpty()}">
                    <img th:src="@{/images/{id}/download(id=${announcement.images.iterator().next().id})}"
                         th:alt="${announcement.title}"
                         class="main-image">

                    <div th:if="${announcement.images.size() > 1}" class="image-thumbnails">
                        <img th:each="image : ${announcement.images}"
                             th:src="@{/images/{id}/download(id=${image.id})}"
                             class="thumbnail">
                    </div>
                </div>
                <div th:unless="${!announcement.images.isEmpty()}" class="image-placeholder">
                    <span>📦 Pas d'image disponible</span>
                </div>
            </div>

            <!-- Informations détaillées -->
            <div class="detail-info">
                <div class="detail-header">
                    <h1 class="detail-title" th:text="${announcement.title}">Titre</h1>
                    <div class="detail-status">
                        <span th:classappend="${announcement.status.name() == 'AVAILABLE' ? 'tag-available' : 'tag-reserved'}"
                              class="status-badge-large"
                              th:text="${announcement.status.label}">Statut</span>
                    </div>
                </div>
                <div class="detail-section">
                    <h2 class="section-title-detail">Description</h2>
                    <p class="detail-description" th:text="${announcement.description}">Description...</p>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="detail-sidebar">
            <div class="sidebar-card">
                <h3 class="sidebar-title">Donneur</h3>
                <div class="owner-info">
                    <div class="owner-avatar">
                        <span th:text="${announcement.ownerUsername.substring(0,1).toUpperCase()}">U</span>
                    </div>
                    <div class="owner-details">
                        <p class="owner-name" th:text="${announcement.ownerUsername}">Username</p>
                        <p class="owner-badge">Membre certifié</p>
                    </div>
                </div>

                <!-- Boutons d'action -->
                <div sec:authorize="isAuthenticated()" class="action-buttons">
                    <a th:href="@{/messages/conversation(announcementId=${announcement.id})}" class="btn-contact">
                        💬 Contacter
                    </a>

                    <!-- BOUTON AJOUTER AUX FAVORIS -->
                    <form th:if="${!isFavorite}" th:action="@{/favorites}" method="POST">
                        <input type="hidden" name="announcementId" th:value="${announcement.id}"/>
                        <button type="submit" class="btn-favorite">
                            <span>🤍</span>
                            <span>Ajouter aux favoris</span>
                        </button>
                    </form>

                    <!-- BOUTON RETIRER DES FAVORIS -->
                    <form th:if="${isFavorite}" th:action="@{/favorites}" method="POST">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <input type="hidden" name="announcementId" th:value="${announcement.id}"/>
                        <button type="submit" class="btn-favorite btn-favorite-active">
                            <span>❤️</span>
                            <span>Retirer des favoris</span>
                        </button>
                    </form>
                </div>

                <!-- Message si NON connecté -->
                <div sec:authorize="!isAuthenticated()" class="login-prompt">
                    <p class="login-prompt-text">Connectez-vous pour contacter le donneur</p>
                    <a th:href="@{/auth/login}" class="btn-login">
                        Se connecter
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
