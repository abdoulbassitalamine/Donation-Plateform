<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Inscription - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div class="text-center">
                <h2 class="text-4xl font-bold text-gray-900">
                    Inscription
                </h2>
                <p class="mt-2 text-gray-600">
                    Créez votre compte DonoPlatform
                </p>
            </div>

            <!-- Message d'erreur -->
            <div th:if="${error}"
                 class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                <span th:text="${error}"></span>
            </div>

            <!-- Formulaire classique -->
            <form th:action="@{/auth/register}"
                  th:object="${user}"
                  method="POST"
                  class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow-md">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">
                            Prénom
                        </label>
                        <input id="firstName"
                               th:field="*{firstName}"
                               type="text"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Jean">
                        <span th:if="${#fields.hasErrors('firstName')}"
                              th:errors="*{firstName}"
                              class="text-red-600 text-sm"></span>
                    </div>

                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">
                            Nom
                        </label>
                        <input id="lastName"
                               th:field="*{lastName}"
                               type="text"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Dupont">
                        <span th:if="${#fields.hasErrors('lastName')}"
                              th:errors="*{lastName}"
                              class="text-red-600 text-sm"></span>
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Nom d'utilisateur *
                    </label>
                    <input id="username"
                           th:field="*{username}"
                           type="text"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="jeandupont">
                    <span th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"
                          class="text-red-600 text-sm"></span>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email *
                    </label>
                    <input id="email"
                           th:field="*{email}"
                           type="email"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="jean.dupont@email.com">
                    <span th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"
                          class="text-red-600 text-sm"></span>
                </div>

                <div>
                    <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-2">
                        Téléphone
                    </label>
                    <input id="phoneNumber"
                           th:field="*{phoneNumber}"
                           type="tel"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="06 12 34 56 78">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Mot de passe *
                    </label>
                    <input id="password"
                           th:field="*{password}"
                           type="password"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="••••••••">
                    <span th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}"
                          class="text-red-600 text-sm"></span>
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    S'inscrire
                </button>

                <div class="text-center">
                    <p class="text-gray-600">
                        Déjà un compte ?
                        <a th:href="@{/auth/login}" class="text-blue-600 hover:text-blue-700 font-semibold">
                            Se connecter
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
