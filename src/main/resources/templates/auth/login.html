<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Connexion - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- En-tête -->
            <div class="text-center">
                <h2 class="text-4xl font-bold text-gray-900">
                    Connexion
                </h2>
                <p class="mt-2 text-gray-600">
                    Connectez-vous à votre compte DonoPlatform
                </p>
            </div>

            <!-- Message de succès si enregistrement -->
            <div th:if="${success}"
                 class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                <span th:text="${success}"></span>
            </div>

            <!-- Message d'erreur -->
            <div th:if="${error}"
                 class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                <span th:text="${error}"></span>
            </div>

            <!-- Formulaire classique (géré par Spring Security) -->
            <form th:action="@{/auth/login}"
                  method="POST"
                  class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow-md">

                <!-- Email -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input id="username"
                           name="username"
                           type="email"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="votre@email.com">
                </div>

                <!-- Mot de passe -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Mot de passe
                    </label>
                    <input id="password"
                           name="password"
                           type="password"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="••••••••">
                </div>

                <!-- Bouton de connexion -->
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    Se connecter
                </button>

                <!-- Lien vers inscription -->
                <div class="text-center">
                    <p class="text-gray-600">
                        Pas encore de compte ?
                        <a th:href="@{/auth/register}" class="text-blue-600 hover:text-blue-700 font-semibold">
                            S'inscrire
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
