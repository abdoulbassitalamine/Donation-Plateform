<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Connexion - DonoPlatform</title>
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="auth-container">
        <div class="auth-container-inner">
            <!-- En-tête -->
            <div class="auth-header">
                <h2 class="auth-title">
                    Connexion
                </h2>
                <p class="auth-subtitle">
                    Connectez-vous à votre compte DonoPlatform
                </p>
            </div>

            <!-- Message de succès si enregistrement -->
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <!-- Message d'erreur -->
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>

            <!-- Formulaire -->
            <div class="auth-card">
                <form th:action="@{/auth/login}"
                      method="POST"
                      class="auth-form">

                    <!-- Email -->
                    <div class="form-field">
                        <label for="username">
                            Email
                        </label>
                        <input id="username"
                               name="username"
                               type="email"
                               required
                               placeholder="votre@email.com">
                    </div>

                    <!-- Mot de passe -->
                    <div class="form-field">
                        <label for="password">
                            Mot de passe
                        </label>
                        <input id="password"
                               name="password"
                               type="password"
                               required
                               placeholder="••••••••">
                    </div>

                    <!-- Bouton de connexion -->
                    <button type="submit" class="auth-submit">
                        Se connecter
                    </button>

                    <!-- Lien vers inscription -->
                    <div class="auth-footer">
                        <p>
                            Pas encore de compte ?
                            <a th:href="@{/auth/register}">
                                S'inscrire
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
