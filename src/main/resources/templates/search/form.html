<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Recherche avancée - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">🔍 Recherche avancée</h1>

            <!-- Formulaire classique POST -->
            <form th:action="@{/search}"
                  th:object="${searchRequest}"
                  method="POST"
                  class="space-y-6">

                <!-- Recherche textuelle -->
                <div>
                    <label for="searchText" class="block text-sm font-medium text-gray-700 mb-2">
                        Recherche par texte
                    </label>
                    <input type="text"
                           id="searchText"
                           th:field="*{searchText}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Mot-clé, titre, description...">
                </div>

                <!-- Zone géographique -->
                <div>
                    <label for="geographicArea" class="block text-sm font-medium text-gray-700 mb-2">
                        Zone géographique
                    </label>
                    <input type="text"
                           id="geographicArea"
                           th:field="*{geographicArea}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Ville, département, région...">
                </div>

                <!-- Filtres -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- État -->
                    <div>
                        <label for="itemCondition" class="block text-sm font-medium text-gray-700 mb-2">
                            État de l'objet
                        </label>
                        <select id="itemCondition"
                                th:field="*{itemCondition}"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Tous les états</option>
                            <option th:each="condition : ${itemConditions}"
                                    th:value="${condition.name()}"
                                    th:text="${condition.label}">
                                État
                            </option>
                        </select>
                    </div>

                    <!-- Statut -->
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700 mb-2">
                            Statut
                        </label>
                        <select id="status"
                                th:field="*{status}"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Tous les statuts</option>
                            <option th:each="stat : ${statuses}"
                                    th:value="${stat.name()}"
                                    th:text="${stat.label}">
                                Statut
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Options de remise -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">
                        Options de remise
                    </label>
                    <div class="space-y-3">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox"
                                   id="handDelivery"
                                   th:field="*{handDelivery}"
                                   class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                            <span class="text-gray-700">Remise en main propre uniquement</span>
                        </label>

                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox"
                                   id="canShip"
                                   th:field="*{canShip}"
                                   class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                            <span class="text-gray-700">Envoi possible</span>
                        </label>
                    </div>
                </div>

                <!-- Boutons -->
                <div class="flex space-x-4 pt-4">
                    <button type="submit"
                            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                        🔍 Rechercher
                    </button>
                    <button type="reset"
                            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-lg transition">
                        🔄 Réinitialiser
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
