<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Mon profil - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content" th:attr="data-user-id=${userId}">
    <!-- En-tête du profil -->
    <div class="bg-white rounded-lg shadow-md p-8 mb-8">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between">
            <div class="flex items-center space-x-6 mb-4 md:mb-0">
                <!-- Avatar -->
                <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-blue-700 rounded-full flex items-center justify-center text-white font-bold text-4xl shadow-lg">
                    <span th:if="${user != null}" th:text="${user.username.substring(0,1).toUpperCase()}">U</span>
                    <span th:unless="${user != null}">?</span>
                </div>

                <!-- Informations utilisateur -->
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-1">
                        <span th:if="${user != null}" th:text="${user.firstName + ' ' + user.lastName}">Nom Prénom</span>
                        <span th:unless="${user != null}">Chargement...</span>
                    </h1>
                    <p class="text-gray-600 mb-2">
                        @<span th:if="${user != null}" th:text="${user.username}">username</span>
                    </p>
                    <p class="text-sm text-gray-500">
                        Membre depuis <span th:if="${user != null}" th:text="${#temporals.format(user.createdAt, 'MMMM yyyy')}">date</span>
                    </p>
                </div>
            </div>

            <div th:if="${isOwnProfile}" class="flex space-x-3">
                <a th:href="@{/users/edit}"
                   class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition">
                    ✏️ Modifier le profil
                </a>
            </div>
        </div>
    </div>

    <!-- Statistiques -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm mb-1">Annonces publiées</p>
                    <p class="text-3xl font-bold text-gray-900" th:text="${announcements.size()}">0</p>
                </div>
                <div class="text-5xl">📢</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm mb-1">Favoris</p>
                    <p class="text-3xl font-bold text-gray-900" th:text="${favorites.size()}">0</p>
                </div>
                <div class="text-5xl">❤️</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm mb-1">Recherches sauvegardées</p>
                    <p class="text-3xl font-bold text-gray-900" th:text="${savedSearches.size()}">0</p>
                </div>
                <div class="text-5xl">🔖</div>
            </div>
        </div>
    </div>

    <!-- Onglets -->
    <div class="bg-white rounded-lg shadow-md mb-8">
        <div class="border-b border-gray-200">
            <nav class="flex space-x-8 px-6" aria-label="Tabs">
                <button onclick="showTab('announcements')"
                        id="tab-announcements"
                        class="tab-button border-b-2 border-blue-600 py-4 px-1 text-sm font-medium text-blue-600">
                    Mes annonces
                </button>
                <button onclick="showTab('favorites')"
                        id="tab-favorites"
                        class="tab-button border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    Mes favoris
                </button>
                <button onclick="showTab('searches')"
                        id="tab-searches"
                        class="tab-button border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    Recherches sauvegardées
                </button>
            </nav>
        </div>

        <div class="p-6">
            <!-- Onglet: Mes annonces -->
            <div id="content-announcements" class="tab-content">
                <div th:if="${!announcements.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div th:each="announcement : ${announcements}"
                         class="bg-gray-50 rounded-lg overflow-hidden hover:shadow-md transition">
                        <div class="h-40 bg-gray-200 overflow-hidden">
                            <img th:if="${!announcement.images.isEmpty()}"
                                 th:src="@{/images/{id}/download(id=${announcement.images.iterator().next().id})}"
                                 class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-gray-900 mb-2" th:text="${announcement.title}">Titre</h3>
                            <div class="flex space-x-2">
                                <a th:href="@{/announcements/{id}(id=${announcement.id})}" class="flex-1 text-center bg-blue-600 text-white text-sm px-3 py-2 rounded">Voir</a>
                                <a th:href="@{/announcements/{id}/edit(id=${announcement.id})}" class="flex-1 text-center bg-gray-600 text-white text-sm px-3 py-2 rounded">Modifier</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${announcements.isEmpty()}" class="text-center py-12">
                    <p class="text-gray-600">Aucune annonce publiée.</p>
                </div>
            </div>

            <!-- Onglet: Mes favoris -->
            <div id="content-favorites" class="tab-content hidden">
                <div th:if="${!favorites.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div th:each="favorite : ${favorites}" class="bg-gray-50 rounded-lg overflow-hidden">
                        <div class="p-4">
                            <h3 class="font-semibold" th:text="${favorite.announcement.title}">Titre</h3>
                            <button onclick="removeFavorite(this)" th:attr="data-announcement-id=${favorite.announcement.id}" class="text-red-600 text-sm">Retirer</button>
                        </div>
                    </div>
                </div>
                <div th:if="${favorites.isEmpty()}" class="text-center py-12">
                    <p class="text-gray-600">Aucun favori.</p>
                </div>
            </div>

            <!-- Onglet: Recherches -->
            <div id="content-searches" class="tab-content hidden">
                <div th:if="${!savedSearches.isEmpty()}" class="space-y-4">
                    <div th:each="search : ${savedSearches}" class="bg-gray-50 rounded-lg p-6">
                        <h3 class="font-semibold" th:text="${search.name}">Nom</h3>
                    </div>
                </div>
                <div th:if="${savedSearches.isEmpty()}" class="text-center py-12">
                    <p class="text-gray-600">Aucune recherche sauvegardée.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function showTab(tabName) {
            // 1. Cacher tous les contenus
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });

            // 2. Réinitialiser le style de tous les boutons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-blue-600', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });

            // 3. Afficher le contenu sélectionné
            document.getElementById('content-' + tabName).classList.remove('hidden');

            // 4. Activer le bouton sélectionné
            const activeBtn = document.getElementById('tab-' + tabName);
            activeBtn.classList.add('border-blue-600', 'text-blue-600');
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
        }

        // Fonctions pour les actions (Stubs à implémenter selon votre API)
        function removeFavorite(btn) {
            const id = btn.getAttribute('data-announcement-id');
            if(confirm('Retirer des favoris ?')) {
                console.log('Suppression favori:', id);
                // Appel API Fetch ici...
            }
        }

        function toggleNotifications(checkbox) {
            const id = checkbox.getAttribute('data-search-id');
            console.log('Toggle notifications pour recherche:', id, checkbox.checked);
        }

        function deleteSavedSearch(btn) {
            const id = btn.getAttribute('data-search-id');
            if(confirm('Supprimer cette recherche ?')) {
                console.log('Suppression recherche:', id);
            }
        }

        function executeSearch(btn) {
            console.log('Exécution de la recherche...');
        }
    </script>
</th:block>

</body>
</html>
