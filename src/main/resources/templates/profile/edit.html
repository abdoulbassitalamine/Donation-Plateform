<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Modifier mon profil - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-2xl mx-auto">
        <!-- En-tête -->
        <div class="mb-8">
            <a th:href="@{/users/{id}(id=${user.id})}"
               class="text-blue-600 hover:text-blue-700 mb-4 inline-block">
                ← Retour au profil
            </a>
            <h1 class="text-4xl font-bold text-gray-900">✏️ Modifier mon profil</h1>
            <p class="text-gray-600 mt-2">Mettez à jour vos informations personnelles</p>
        </div>

        <!-- Formulaire -->
        <form th:action="@{/users/edit}" method="POST" class="bg-white rounded-lg shadow-md p-8 space-y-6">

            <!-- Message d'erreur -->
            <div th:if="${error}"
                 class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                <span th:text="${error}">Erreur</span>
            </div>

            <!-- Nom d'utilisateur (lecture seule) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Nom d'utilisateur
                </label>
                <input type="text"
                       th:value="${user.username}"
                       readonly
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed">
                <p class="text-xs text-gray-500 mt-1">Le nom d'utilisateur ne peut pas être modifié</p>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       th:value="${user.email}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <!-- Prénom et Nom -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">
                        Prénom
                    </label>
                    <input type="text"
                           id="firstName"
                           name="firstName"
                           th:value="${user.firstName}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div>
                    <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">
                        Nom
                    </label>
                    <input type="text"
                           id="lastName"
                           name="lastName"
                           th:value="${user.lastName}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>

            <!-- Téléphone -->
            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-2">
                    Téléphone
                </label>
                <input type="tel"
                       id="phoneNumber"
                       name="phoneNumber"
                       th:value="${user.phoneNumber}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="06 12 34 56 78">
            </div>

            <!-- Mot de passe -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Nouveau mot de passe
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Laissez vide pour ne pas changer">
                <p class="text-xs text-gray-500 mt-1">Minimum 6 caractères</p>
            </div>

            <!-- Boutons -->
            <div class="flex space-x-4 pt-4">
                <button type="submit"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    ✅ Enregistrer les modifications
                </button>
                <a th:href="@{/users/{id}(id=${user.id})}"
                   class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-lg transition text-center">
                    Annuler
                </a>
            </div>
        </form>

        <!-- Informations du compte -->
        <div class="bg-gray-50 rounded-lg p-6 mt-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Informations du compte</h3>
            <div class="space-y-2 text-sm text-gray-600">
                <p>
                    <span class="font-medium">Membre depuis :</span>
                    <span th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy')}">Date</span>
                </p>
                <p>
                    <span class="font-medium">Statut :</span>
                    <span th:if="${user.active}" class="text-green-600 font-semibold">Actif</span>
                    <span th:unless="${user.active}" class="text-red-600 font-semibold">Inactif</span>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
