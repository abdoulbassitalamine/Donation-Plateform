<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Messagerie - DonoPlatform</title>
</head>
<body>
<div layout:fragment="content">
    <!-- En-tête -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-4xl font-bold text-gray-900">💬 Messagerie</h1>
            <p class="text-gray-600 mt-2">
                <span th:if="${unreadCount > 0}"
                      class="font-semibold text-blue-600"
                      th:text="${unreadCount}">0</span>
                <span th:if="${unreadCount > 0}"> message(s) non lu(s)</span>
                <span th:if="${unreadCount == 0}">Aucun message non lu</span>
            </p>
        </div>
    </div>

    <!-- Liste des messages groupés par conversation -->
    <div class="bg-white rounded-lg shadow-md">
        <div th:if="${!messages.isEmpty()}">
            <!-- En-tête du tableau -->
            <div class="grid grid-cols-12 gap-4 px-6 py-4 border-b border-gray-200 font-semibold text-gray-700 text-sm">
                <div class="col-span-4">Contact</div>
                <div class="col-span-5">Annonce</div>
                <div class="col-span-2">Date</div>
                <div class="col-span-1 text-center">Statut</div>
            </div>

            <!-- Liste des messages -->
            <div class="divide-y divide-gray-200">
                <div th:each="message : ${messages}"
                     class="grid grid-cols-12 gap-4 px-6 py-4 hover:bg-gray-50 transition cursor-pointer"
                     th:with="otherUserId=${message.senderId == userId ? message.receiverId : message.senderId}"
                     th:onclick="|window.location.href='/messages/conversation?announcementId=${message.announcementId}&otherUserId=' + ${otherUserId}|">

                    <!-- Contact -->
                    <div class="col-span-4 flex items-center space-x-3">
                        <!-- Avatar -->
                        <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">
                            <span th:if="${message.senderId == userId}"
                                  th:text="${message.receiverUsername.substring(0,1).toUpperCase()}">U</span>
                            <span th:unless="${message.senderId == userId}"
                                  th:text="${message.senderUsername.substring(0,1).toUpperCase()}">U</span>
                        </div>

                        <!-- Nom -->
                        <div class="min-w-0">
                            <p class="font-semibold text-gray-900 truncate">
                                <span th:if="${message.senderId == userId}"
                                      th:text="${message.receiverUsername}">Contact</span>
                                <span th:unless="${message.senderId == userId}"
                                      th:text="${message.senderUsername}">Contact</span>
                            </p>
                            <p class="text-sm text-gray-600 truncate" th:text="${message.content}">
                                Dernier message...
                            </p>
                        </div>
                    </div>

                    <!-- Annonce -->
                    <div class="col-span-5 flex items-center">
                        <div class="min-w-0">
                            <p class="font-medium text-gray-900 truncate"
                               th:text="${message.announcementTitle}">
                                Titre de l'annonce
                            </p>
                            <p class="text-sm text-gray-500">
                                Annonce #<span th:text="${message.announcementId}">ID</span>
                            </p>
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="col-span-2 flex items-center">
                        <span class="text-sm text-gray-600"
                              th:text="${#temporals.format(message.sentAt, 'dd/MM/yyyy HH:mm')}">
                            Date
                        </span>
                    </div>

                    <!-- Statut -->
                    <div class="col-span-1 flex items-center justify-center">
                        <span th:if="${!message.read && message.receiverId == userId}"
                              class="w-3 h-3 bg-blue-600 rounded-full"
                              title="Non lu"></span>
                        <span th:if="${message.read || message.receiverId != userId}"
                              class="text-gray-400"
                              title="Lu">✓</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message si vide -->
        <div th:if="${messages.isEmpty()}" class="text-center py-16">
            <div class="text-6xl mb-4">💬</div>
            <h3 class="text-xl font-semibold text-gray-900 mb-2">Aucun message</h3>
            <p class="text-gray-600 mb-6">Vous n'avez pas encore de conversation</p>
            <a th:href="@{/announcements}"
               class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition">
                Parcourir les annonces
            </a>
        </div>
    </div>
</div>
</body>
</html>
