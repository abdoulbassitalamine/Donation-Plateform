<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Conversation - DonoPlatform</title>
    <link rel="stylesheet" th:href="@{/css/messages.css}">
</head>
<body>
<div layout:fragment="content">
    <!-- En-tête de la conversation -->
    <div class="conversation-header">
        <div class="conversation-header-content">
            <div class="conversation-nav">
                <a th:href="@{/messages}" class="btn-back">
                    ← Retour
                </a>

                <!-- Info de la conversation -->
                <div class="conversation-info" th:if="${!conversation.isEmpty()}">
                    <div class="conversation-avatar">
                        <span th:with="otherUser=${conversation[0].senderId == userId ? conversation[0].receiverUsername : conversation[0].senderUsername}"
                              th:text="${otherUser.substring(0,1).toUpperCase()}">U</span>
                    </div>
                    <div class="conversation-details">
                        <h2 class="conversation-contact-name">
                            <span th:with="otherUser=${conversation[0].senderId == userId ? conversation[0].receiverUsername : conversation[0].senderUsername}"
                                  th:text="${otherUser}">Contact</span>
                        </h2>
                        <p class="conversation-about">
                            À propos de:
                            <a th:href="@{/announcements/{id}(id=${announcementId})}"
                               th:text="${!conversation.isEmpty() ? conversation[0].announcementTitle : 'Annonce'}">
                                Annonce
                            </a>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Lien vers l'annonce -->
            <a th:if="${!conversation.isEmpty()}"
               th:href="@{/announcements/{id}(id=${announcementId})}"
               class="btn-view-announcement">
                📢 Voir l'annonce
            </a>
        </div>
    </div>

    <!-- Zone de conversation -->
    <div class="conversation-container">
        <!-- Messages -->
        <div id="messagesContainer" class="messages-container">
            <div th:if="${conversation.isEmpty()}" class="message-empty">
                Aucun message dans cette conversation
            </div>

            <div th:each="message : ${conversation}">
                <!-- Message reçu (gauche) -->
                <div th:if="${message.senderId != userId}"
                     class="message-wrapper message-wrapper-received">
                    <div class="message-bubble">
                        <div class="message-content message-content-received">
                            <p class="message-text" th:text="${message.content}">
                                Contenu du message
                            </p>
                            <p class="message-meta">
                                <span class="message-time message-time-received"
                                      th:text="${#temporals.format(message.sentAt, 'dd/MM/yyyy à HH:mm')}">
                                    Date
                                </span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Message envoyé (droite) -->
                <div th:if="${message.senderId == userId}"
                     class="message-wrapper message-wrapper-sent">
                    <div class="message-bubble">
                        <div class="message-content message-content-sent">
                            <p class="message-text" th:text="${message.content}">
                                Contenu du message
                            </p>
                            <div class="message-meta">
                                <p class="message-time message-time-sent"
                                   th:text="${#temporals.format(message.sentAt, 'dd/MM/yyyy à HH:mm')}">
                                    Date
                                </p>
                                <span class="message-read-status message-read-status-sent">
                                    <span th:if="${message.read}">✓✓</span>
                                    <span th:unless="${message.read}">✓</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulaire d'envoi -->
        <div class="message-form-container">
            <form th:action="@{/messages}" method="POST" class="message-form">
                <!-- Champs cachés -->
                <input type="hidden" name="announcementId" th:value="${announcementId}">
                <input type="hidden" name="receiverId" th:value="${receiverId}">

                <textarea name="content" rows="2" required
                          placeholder="Écrivez votre message..."></textarea>

                <button type="submit" class="btn-send">
                    ✉️ Envoyer
                </button>
            </form>
        </div>
    </div>
</div>

<script layout:fragment="scripts">
    // Scroll vers le bas au chargement
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('messagesContainer');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    });
</script>
</body>
</html>
