<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
    <div class="container mx-auto px-4 py-3">
        <div class="flex justify-between items-center">

            <!-- Logo -->
            <a th:href="@{/}" class="flex items-center space-x-2 group">
                <span class="text-2xl group-hover:scale-110 transition-transform duration-300">🎁</span>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">
                    Dono<span class="text-blue-600">Platform</span>
                </span>
            </a>

            <!-- Navigation -->
            <nav class="hidden lg:flex items-center space-x-8">
                <a th:href="@{/}" class="text-sm font-medium text-gray-500 hover:text-blue-600 transition">Accueil</a>
                <a th:href="@{/announcements}" class="text-sm font-medium text-gray-700 hover:text-blue-600 transition">Annonces</a>
                <a th:href="@{/search}" class="text-sm font-medium text-gray-700 hover:text-blue-600 transition">Rechercher</a>
            </nav>


            <div class="flex items-center">

                <div sec:authorize="isAuthenticated()" class="flex items-center space-x-2 sm:space-x-5">

                    <div class="flex items-center space-x-4 pr-4 border-r border-gray-100">
                        <a th:href="@{/announcements/create}" title="Publier" class="text-gray-600 hover:text-blue-600 transition">
                            <span class="text-xl">📢</span>
                        </a>
                        <a th:href="@{/messages}" title="Messages" class="text-gray-600 hover:text-blue-600 transition">
                            <span class="text-xl">💬</span>
                        </a>

                        <!-- Notifications avec badge -->
                        <a th:href="@{/notifications}" title="Notifications" class="relative text-gray-600 hover:text-blue-600 transition">
                            <span class="text-xl">🔔</span>
                            <span th:if="${notificationCount != null && notificationCount > 0}"
                                  class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold shadow-lg"
                                  th:text="${notificationCount > 99 ? '99+' : notificationCount}">
                                0
                            </span>
                        </a>
                    </div>


                    <div class="flex items-center space-x-3">
                        <a th:href="@{/users/{id}(id=${#authentication.principal.id})}"
                           class="flex items-center space-x-2 p-1 rounded-full hover:bg-gray-50 transition">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold shadow-sm">
                                <span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                            </div>
                            <span class="hidden md:block text-sm font-semibold text-gray-700" th:text="${#authentication.name}">User</span>
                        </a>

                        <form th:action="@{/auth/logout}" method="POST" class="inline">
                            <button type="submit"
                                    class="flex items-center space-x-1 px-3 py-1.5 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-all duration-200"
                                    title="Déconnexion">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                <span class="hidden sm:block text-xs font-bold uppercase tracking-wider">Quitter</span>
                            </button>
                        </form>
                    </div>
                </div>

                <div sec:authorize="!isAuthenticated()" class="flex items-center space-x-4">
                    <a th:href="@{/auth/login}" class="text-sm font-semibold text-gray-600 hover:text-blue-600 transition">
                        Connexion
                    </a>
                    <a th:href="@{/auth/register}"
                       class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md shadow-blue-200 transition-all active:scale-95">
                        S'inscrire
                    </a>
                </div>

            </div>
        </div>
    </div>
</header>
</body>
</html>
